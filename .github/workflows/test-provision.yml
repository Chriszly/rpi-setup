name: Virtual Testing Environment

# Docs-only and .claude/ (agent skill) changes cannot affect provisioning, so they skip this workflow.
on:
  pull_request:
    paths-ignore: &paths-ignore ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  push:
    branches:
      - main
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-test-${{ github.ref }}
  # Only cancel superseded PR runs; let pushes to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    name: Syntax check, lint, and task registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate bash syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f"
          done
          echo "All shell scripts pass 'bash -n'"

      # shellcheck ships with the hosted runner image.
      - name: Run shellcheck
        run: shellcheck --color=never setup.sh lib/*.sh tasks/*.sh host/*.sh ci/*.sh config/*.sh

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -no-color -oneline

      - name: Verify task registry loads
        run: bash setup.sh --list

      - name: No settings, keys or passwords committed
        run: bash ci/check-no-secrets.sh

  unit:
    name: Unit tests (lib, setup.sh, flash.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test lib/common.sh and host/flash.sh helpers
        run: sudo bash ci/test-lib.sh

      - name: Test setup.sh CLI and menu
        run: sudo bash ci/test-setup.sh

      - name: Test the secrets check
        run: bash ci/test-no-secrets.sh

      - name: Test task helpers (ci/test-task-*.sh)
        run: for t in ci/test-task-*.sh; do echo "== $t"; sudo bash "$t"; done

  # Exercises the Docker-based tasks on a plain x86 runner. The nspawn gate
  # cannot run Docker, so without this the compose/UID logic in netalertx and
  # teamspeak would only be tested by the manual QEMU job.
  docker-smoke:
    name: Docker tasks on plain runner
    runs-on: ubuntu-latest
    needs: [syntax, unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Provision Docker tasks
        env:
          PROVISION_PROFILE: docker
        run: sudo -E bash ci/provision.sh "$GITHUB_WORKSPACE"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-logs
          path: ci-logs/
          retention-days: 7

  # The <TASK>_DOCKER=yes mode on a plain x86 runner, which has Docker and a
  # booted systemd (the nspawn gate has neither Docker nor a real port 53).
  container-helpers:
    name: Container helpers (lib/containers.sh)
    runs-on: ubuntu-latest
    needs: [syntax, unit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Test lib/containers.sh
        run: sudo bash ci/test-containers.sh

  # One ci/smoke-container-<task>.sh per task: runs "setup.sh <task>" with
  # <TASK>_DOCKER=yes, checks the service answers, re-runs it and switches back.
  container-smoke:
    name: Container tasks on plain runner
    runs-on: ubuntu-latest
    needs: [container-helpers]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Run every ci/smoke-container-*.sh
        run: |
          set -euo pipefail
          for t in ci/smoke-container-*.sh; do
            echo "::group::$t"
            sudo bash "$t"
            echo "::endgroup::"
          done

      - name: Show containers and logs on failure
        if: failure()
        run: |
          sudo docker ps -a || true
          for c in $(sudo docker ps -aq); do
            echo "::group::$(sudo docker inspect -f '{{.Name}}' "$c")"
            sudo docker logs --tail 100 "$c" 2>&1 || true
            echo "::endgroup::"
          done

  # Decides whether the PR touches anything the nspawn gate exercises. PRs that
  # only change the flashers, their tests or other workflows skip the gate.
  changes:
    name: Detect provisioning changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      provision: ${{ steps.filter.outputs.provision }}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            provision:
              - setup.sh
              - lib/**
              - tasks/**
              - ci/provision.sh
              - .github/workflows/test-provision.yml
              - .github/actions/**

  # Runs on the latest release (what host/flash.sh and host/flash.ps1 write
  # today, resolved at run time) and on Bookworm (what existing Pis still run).
  # Each release runs as two parallel jobs (ci/provision.sh profiles
  # container-system and container-web): package installs under arm64
  # emulation dominate the gate, and splitting them roughly halves wall time.
  provision-gate:
    name: Provision tasks in booted nspawn (PR gate, ${{ matrix.release }}, ${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: [syntax, unit, changes]
    if: needs.changes.outputs.provision == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, latest]
        group: [system, web]
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Raspberry Pi OS image
        id: image
        uses: ./.github/actions/prepare-image
        with:
          version: ${{ matrix.release }}

      # host/flash.sh and host/flash.ps1 enable SSH and create the login user
      # by writing "ssh" and "userconf.txt" to the boot partition. Fail if a new
      # Raspberry Pi OS release stops shipping the services that read them.
      - name: Check the image honours the flashers' first-boot files
        env:
          IMG: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          r=/tmp/fbroot
          sudo mkdir -p "$r"
          dev="$(sudo losetup -fP --show "$IMG")"
          sudo mount -o ro "${dev}p2" "$r"
          rc=0
          for unit in userconfig.service sshswitch.service; do
            # The wants/ entries are absolute symlinks, so test the link itself.
          if [[ -L "$r/etc/systemd/system/multi-user.target.wants/$unit" ]]; then
              echo "OK: $unit is enabled in the image"
            else
              echo "::error::$unit is not enabled in the image; the ssh/userconf.txt files written by host/flash.* would be ignored"
              rc=1
            fi
          done
          sudo umount "$r"
          sudo losetup -d "$dev"
          exit "$rc"

      # pinspawn-action needs systemd-container, qemu-user-static and
      # binfmt-support, and skips its own apt install when they are present.
      # The runner's Ubuntu mirror serves them at 70-110 kB/s (2-4 minutes per
      # run), so their .debs are cached, keyed on the runner image so they
      # always match its base system.
      - name: Restore cached nspawn host packages
        id: nspawn-debs
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/nspawn-debs
          key: nspawn-debs-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}

      - name: Install nspawn host packages
        env:
          DEB_DIR: ${{ runner.temp }}/nspawn-debs
          CACHE_HIT: ${{ steps.nspawn-debs.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$CACHE_HIT" != true ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --download-only systemd-container qemu-user-static binfmt-support
            mkdir -p "$DEB_DIR"
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} "$DEB_DIR/" \;
          fi
          shopt -s nullglob
          debs=("$DEB_DIR"/*.deb)
          if [[ ${#debs[@]} -eq 0 ]]; then
            echo "Nothing to install; the packages are already on the runner"
          else
            sudo DEBIAN_FRONTEND=noninteractive dpkg -i "${debs[@]}"
          fi

      - name: Save nspawn host packages to cache
        if: steps.nspawn-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nspawn-debs
          key: ${{ steps.nspawn-debs.outputs.cache-primary-key }}

      - name: Provision tasks in booted container
        uses: ethanjli/pinspawn-action@ff063750a0e85cf96bd513df9134c27d31899285
        with:
          image: ${{ steps.image.outputs.image }}
          shell: bash
          boot: true
          user: root
          args: --bind ${{ github.workspace }}:/workspace
          run: |
            set -euo pipefail
            cd /workspace
            PROVISION_PROFILE=container-${{ matrix.group }} bash ci/provision.sh /workspace

      # ci/provision.sh writes the guest's journal, service status and logs to
      # <workdir>/ci-logs on failure; /workspace is the bind-mounted checkout.
      - name: Upload guest logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: provision-gate-logs-${{ matrix.release }}-${{ matrix.group }}
          path: ci-logs/
          retention-days: 7

  provision-qemu:
    name: Provision tasks in QEMU VM (manual)
    runs-on: ubuntu-latest
    needs: [syntax, unit]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # piqemu-action can only boot Bookworm (its DTB build is Bookworm-specific).
      - name: Prepare Raspberry Pi OS image
        id: image
        uses: ./.github/actions/prepare-image
        with:
          version: bookworm

      - name: Copy repository into image
        env:
          IMG: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/rpi-root
          dev="$(sudo losetup -fP --show "$IMG")"
          sudo mount "${dev}p2" /tmp/rpi-root
          sudo mkdir -p /tmp/rpi-root/opt
          sudo cp -a "$GITHUB_WORKSPACE" /tmp/rpi-root/opt/rpi-setup
          sudo chown -R root:root /tmp/rpi-root/opt/rpi-setup
          sudo umount /tmp/rpi-root
          sudo losetup -d "$dev"

      - name: Provision tasks in QEMU VM
        id: qemu
        uses: ethanjli/piqemu-action@e5583ccf2ecf06ef869dd102a01909d887d96b11
        with:
          image: ${{ steps.image.outputs.image }}
          machine: rpi-3b+
          shell: bash
          run: |
            set -euo pipefail
            PROVISION_PROFILE=full bash ci/provision.sh /opt/rpi-setup

      # QEMU has no bind mount, so pull the guest's ci-logs back out of the
      # image after the VM has shut down.
      - name: Extract guest logs from image
        if: failure() && steps.qemu.outcome == 'failure'
        env:
          IMG: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs"
          sudo mkdir -p /tmp/rpi-root
          dev="$(sudo losetup -fP --show "$IMG")"
          sudo mount "${dev}p2" /tmp/rpi-root
          if [[ -d /tmp/rpi-root/opt/rpi-setup/ci-logs ]]; then
            sudo cp -a /tmp/rpi-root/opt/rpi-setup/ci-logs/. "$RUNNER_TEMP/ci-logs/"
          else
            echo "No ci-logs directory found in the guest image" | tee "$RUNNER_TEMP/ci-logs/missing.txt"
          fi
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ci-logs"
          sudo umount /tmp/rpi-root
          sudo losetup -d "$dev"

      - name: Upload guest logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: provision-qemu-logs
          path: ${{ runner.temp }}/ci-logs/
          retention-days: 7
