name: Flash Script Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flash-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flash:
    name: Validate host/flash.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('host/flash.ps1', 'ci/test-flash.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "[error] ${file}: $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "$file parses without syntax errors"
            }
          }
          if ($failed) { exit 1 }

      # Rule exclusions live in PSScriptAnalyzerSettings.psd1 at the repo root.
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }
          $results = foreach ($file in @('host/flash.ps1', 'ci/test-flash.ps1')) {
            Invoke-ScriptAnalyzer -Path $file -Settings PSScriptAnalyzerSettings.psd1 -Severity Error, Warning
          }
          if ($results) {
            $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            Write-Host "PSScriptAnalyzer reported $($results.Count) finding(s)."
            exit 1
          }
          Write-Host 'PSScriptAnalyzer found no issues.'

      - name: Run flash.ps1 unit tests
        shell: pwsh
        run: ./ci/test-flash.ps1
