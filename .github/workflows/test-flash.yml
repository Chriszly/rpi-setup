name: Flash Script Tests

# Only the PowerShell flasher and its tests are checked here.
on:
  pull_request:
    paths:
      - 'host/flash.ps1'
      - 'ci/test-flash.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/test-flash.yml'
  push:
    branches:
      - main
    paths:
      - 'host/flash.ps1'
      - 'ci/test-flash.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/test-flash.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flash-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flash:
    name: Validate host/flash.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('host/flash.ps1', 'ci/test-flash.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "[error] ${file}: $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "$file parses without syntax errors"
            }
          }
          if ($failed) { exit 1 }

      # Severity and rule exclusions live in PSScriptAnalyzerSettings.psd1 at the
      # repo root. The windows runner image ships the PSScriptAnalyzer module.
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = foreach ($file in @('host/flash.ps1', 'ci/test-flash.ps1')) {
            Invoke-ScriptAnalyzer -Path $file -Settings PSScriptAnalyzerSettings.psd1
          }
          if ($results) {
            $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            Write-Host "PSScriptAnalyzer reported $($results.Count) finding(s)."
            exit 1
          }
          Write-Host 'PSScriptAnalyzer found no issues.'

      - name: Run flash.ps1 unit tests (PowerShell 7)
        shell: pwsh
        run: ./ci/test-flash.ps1

      # flash.ps1 is written for Windows PowerShell 5.1, which every Windows
      # ships, so the tests run there too: no char ranges, ternaries or other
      # PowerShell 7 syntax may slip in.
      - name: Run flash.ps1 unit tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Host 'Expected Windows PowerShell 5.x'; exit 1 }
          ./ci/test-flash.ps1
          exit $LASTEXITCODE
