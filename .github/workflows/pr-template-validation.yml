name: PR Template Validation

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate-pr-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body matches template
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const requiredSections = [
              '## Summary',
              '## Type of change',
              '## Checklist',
              '## Testing'
            ];

            const missing = requiredSections.filter(section => !body.includes(section));

            if (missing.length > 0) {
              core.setFailed(`PR description is missing required sections: ${missing.join(', ')}. Please use the PR template.`);
            } else {
              console.log('PR template validation passed.');
            }