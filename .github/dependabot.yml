version: 2
updates:
  # Keep the actions current in .github/workflows, the prepare-image composite
  # action and the workflows the private-repo template copies, including the
  # SHA-pinned pinspawn/piqemu actions. "/" alone only covers .github/workflows.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/prepare-image
      - /templates/private-repo
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    # A changetype and a domaintype label; without this Dependabot would add its
    # own default labels.
    labels:
      - chore
      - ci
