name: Install systemd-nspawn host packages
description: >-
  Install the host packages pinspawn-action needs (systemd-container,
  qemu-user-static, binfmt-support) from a cache of their .deb files. The
  runner's Ubuntu mirror serves them at 70-110 kB/s, so installing them
  through pinspawn-action took 2-4 minutes of every gate run. With the
  packages already installed, pinspawn-action skips its own apt install.

runs:
  using: composite
  steps:
    # Keyed on the runner image, so the .debs always match the installed base
    # system; a new runner image (roughly weekly) downloads them once.
    - name: Restore cached packages
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/nspawn-debs
        key: nspawn-debs-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}

    - name: Download packages
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEB_DIR: ${{ runner.temp }}/nspawn-debs
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq --download-only systemd-container qemu-user-static binfmt-support
        mkdir -p "$DEB_DIR"
        find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} "$DEB_DIR/" \;
        ls -l "$DEB_DIR"

    - name: Save packages to cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/nspawn-debs
        key: ${{ steps.restore.outputs.cache-primary-key }}

    - name: Install packages
      shell: bash
      env:
        DEB_DIR: ${{ runner.temp }}/nspawn-debs
      run: |
        set -euo pipefail
        shopt -s nullglob
        debs=("$DEB_DIR"/*.deb)
        if [[ ${#debs[@]} -eq 0 ]]; then
          echo "Nothing to install; the packages are already on the runner"
          exit 0
        fi
        sudo DEBIAN_FRONTEND=noninteractive dpkg -i "${debs[@]}"
