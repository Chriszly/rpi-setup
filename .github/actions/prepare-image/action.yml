name: Prepare Raspberry Pi OS image
description: >-
  Download (or restore from cache) a Raspberry Pi OS image, verify its SHA-256,
  extract it and grow the root partition so the provisioning jobs have room
  for apt upgrades and container images. Shared by provision-gate and
  provision-qemu so the two jobs cannot drift apart.

inputs:
  version:
    description: >-
      "latest" resolves the newest Raspberry Pi OS Lite arm64 release at run
      time, the same image host/flash.sh and host/flash.ps1 download;
      "bookworm" is the pinned Bookworm image for Pis that still run it (and
      the only one piqemu-action can boot).
    required: true

outputs:
  image:
    description: Path of the extracted, grown raw .img
    value: ${{ steps.paths.outputs.image }}

runs:
  using: composite
  steps:
    - name: Resolve image and paths
      id: paths
      shell: bash
      env:
        IMG_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$IMG_VERSION" in
          bookworm)
            # To bump: pick an image and its .sha256 from the download index.
            # The cache key follows the date, so the new image is fetched once.
            IMG_VERSION=2025-05-13
            IMG_URL=https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-05-13/2025-05-13-raspios-bookworm-arm64-lite.img.xz
            IMG_SHA256=62d025b9bc7ca0e1facfec74ae56ac13978b6745c58177f081d39fbb8041ed45
            ;;
          latest)
            # Sourcing flash.sh only defines its functions; main runs only
            # when it is executed.
            . "$GITHUB_WORKSPACE/host/flash.sh"
            release="$(latest_release)"
            img="$(curl -fsSL --retry 3 "$BASE_URI/images/$release/" | grep -oE 'href="[^"]+\.img\.xz"' | head -n1 | sed 's/href="//; s/"$//')"
            [[ -n "$img" ]] || { echo "Could not resolve the latest image" >&2; exit 1; }
            IMG_VERSION="${release#raspios_lite_arm64-}"
            IMG_URL="$BASE_URI/images/$release/$img"
            IMG_SHA256="$(curl -fsSL --retry 3 "$IMG_URL.sha256" | awk '{print $1}')"
            echo "Latest image: $IMG_URL"
            ;;
          *)
            echo "Unknown version '$IMG_VERSION' (expected latest or bookworm)" >&2
            exit 1
            ;;
        esac
        {
          echo "version=$IMG_VERSION"
          echo "url=$IMG_URL"
          echo "sha256=$IMG_SHA256"
          echo "xz=$RUNNER_TEMP/raspios-arm64-lite-$IMG_VERSION.img.xz"
          echo "image=$RUNNER_TEMP/raspios-arm64-lite-$IMG_VERSION.img"
        } >> "$GITHUB_OUTPUT"

    - name: Restore cached image
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.paths.outputs.xz }}
        key: raspios-arm64-lite-${{ steps.paths.outputs.version }}

    - name: Download and verify image
      shell: bash
      env:
        IMG_XZ: ${{ steps.paths.outputs.xz }}
        IMG_URL: ${{ steps.paths.outputs.url }}
        IMG_SHA256: ${{ steps.paths.outputs.sha256 }}
      run: |
        set -euo pipefail
        if [[ ! -f "$IMG_XZ" ]]; then
          echo "Downloading Raspberry Pi OS image..."
          curl -fL --retry 3 -o "$IMG_XZ" "$IMG_URL"
        fi
        echo "$IMG_SHA256  $IMG_XZ" | sha256sum -c -

    # Save right after verification, so a later provisioning failure does not
    # force the next run to download the image again. (actions/cache's
    # save-always input is deprecated and a no-op.)
    - name: Save image to cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.paths.outputs.xz }}
        key: ${{ steps.restore.outputs.cache-primary-key }}

    - name: Extract image
      shell: bash
      env:
        IMG_XZ: ${{ steps.paths.outputs.xz }}
        IMG: ${{ steps.paths.outputs.image }}
      run: |
        set -euo pipefail
        if [[ ! -f "$IMG" ]]; then
          echo "Extracting Raspberry Pi OS image..."
          xz -d -k "$IMG_XZ"
        fi

    - name: Grow root partition
      shell: bash
      env:
        IMG: ${{ steps.paths.outputs.image }}
      run: |
        set -euo pipefail
        echo "Growing root partition to 8G..."
        sudo truncate -s 8G "$IMG"
        sudo parted -s "$IMG" resizepart 2 100%
        dev="$(sudo losetup -fP --show "$IMG")"
        sudo e2fsck -fp "${dev}p2" || true
        sudo resize2fs "${dev}p2"
        sudo losetup -d "$dev"
